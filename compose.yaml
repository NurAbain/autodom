# Local development topology. Production application nodes use compose.bot.yaml
# (bot + Mini App) and compose.worker.yaml (parsers), with compose.infra.yaml
# retaining shared PostgreSQL/Redis separately. Never delete production volumes.
name: autodom-ts

services:
  postgres:
    extends:
      file: compose.infra.yaml
      service: postgres

  redis:
    extends:
      file: compose.infra.yaml
      service: redis

  bot:
    extends:
      file: compose.bot.yaml
      service: bot
    environment:
      AUTODOM_DATABASE_URL: postgresql://autodom:${AUTODOM_POSTGRES_PASSWORD:?Set a URL-safe Autodom database password}@postgres:5432/autodom
    depends_on:
      postgres: {condition: service_healthy}

  worker:
    extends:
      file: compose.worker.yaml
      service: worker
    # Inherits the dedicated SMARTPROXY_LALAFO_* route and solver key from compose.worker.yaml.
    environment:
      AUTODOM_DATABASE_URL: postgresql://autodom:${AUTODOM_POSTGRES_PASSWORD:?Set a URL-safe Autodom database password}@postgres:5432/autodom
      AUTODOM_REDIS_URL: redis://:${AUTODOM_REDIS_PASSWORD:?Set a URL-safe Autodom Redis password}@redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

networks:
  proxy: {}

volumes:
  postgres-data:
  redis-data:
  crawler-data:
  snapshots:
