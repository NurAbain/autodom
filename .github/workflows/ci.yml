name: CI

on:
  push:
    branches: [main, ts-migration]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      AUTODOM_TEST_DATABASE_URL: postgresql://autodom_ci:autodom_ci_password@127.0.0.1:5432/autodom_test
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PUPPETEER_SKIP_DOWNLOAD: "1"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: autodom_test
          POSTGRES_USER: autodom_ci
          POSTGRES_PASSWORD: autodom_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autodom_ci -d autodom_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "10.34.5"
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test against isolated PostgreSQL
        timeout-minutes: 10
        run: pnpm test

      - name: Build runtime
        run: pnpm build

      - name: Validate Compose configuration
        env:
          AUTODOM_POSTGRES_PASSWORD: autodom_ci_password
          AUTODOM_REDIS_PASSWORD: autodom_ci_redis_password
        run: docker compose config --quiet

      - name: Build runtime image
        timeout-minutes: 10
        run: docker build --tag autodom:ci .

      - name: Verify image runs as its configured non-root user
        run: >-
          docker run --rm --network none --entrypoint node autodom:ci
          -e 'if (process.getuid() !== 10001 || process.getgid() !== 10001) { throw new Error("Expected runtime UID/GID 10001"); } console.log("Runtime UID/GID: 10001:10001");'

      - name: Exercise image entrypoint help without network
        timeout-minutes: 1
        run: docker run --rm --network none autodom:ci --help

      - name: Migrate isolated PostgreSQL with built image
        timeout-minutes: 2
        # Settings require a Redis URL, but migrate does not connect to Redis.
        # Health requires active runtime heartbeats; do not start pollers in CI.
        run: >-
          docker run --rm --network host
          --env AUTODOM_DATABASE_URL="$AUTODOM_TEST_DATABASE_URL"
          --env AUTODOM_REDIS_URL=redis://127.0.0.1:6379/0
          autodom:ci migrate
