# Separate Coolify resource in Autodom production, deployed independently of bot/parser.
# Server-to-server only: no public port or domain, no PostgreSQL/Redis/Telegram credentials.
# Join the existing Autodom network; clients use http://autodom-vin-api:8080.
services:
  vin-api:
    build:
      context: .
      dockerfile: apps/vin/Dockerfile
    image: ${AUTODOM_VIN_IMAGE:-autodom-vin:local}
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 0.5
    command: [serve]
    environment:
      AUTODOM_VIN_API_HOST: "0.0.0.0"
      AUTODOM_VIN_API_PORT: "8080"
      # Runtime validates these before listening; image builds must not need secrets.
      AUTODOM_VIN_API_TOKEN: ${AUTODOM_VIN_API_TOKEN:-}
      AUTODOM_VIN_PROVIDERS: ${AUTODOM_VIN_PROVIDERS:-}
      AUTODOM_AUTODEV_API_KEY: ${AUTODOM_AUTODEV_API_KEY:-}
      AUTODOM_VIN_API_MAX_IN_FLIGHT: ${AUTODOM_VIN_API_MAX_IN_FLIGHT:-10}
      AUTODOM_CRAWL_DELAY: ${AUTODOM_CRAWL_DELAY:-2}
      SMARTPROXY_USERNAME: ${SMARTPROXY_USERNAME:-}
      SMARTPROXY_PASSWORD: ${SMARTPROXY_PASSWORD:-}
      SMARTPROXY_DATACENTER_ENDPOINT: ${SMARTPROXY_DATACENTER_ENDPOINT:-dc.decodo.com:10000}
      SMARTPROXY_DATACENTER_PORT_START: ${SMARTPROXY_DATACENTER_PORT_START:-0}
      SMARTPROXY_DATACENTER_PORT_COUNT: ${SMARTPROXY_DATACENTER_PORT_COUNT:-0}
      SMARTPROXY_RESIDENTIAL_USERNAME: ${SMARTPROXY_RESIDENTIAL_USERNAME:-}
      SMARTPROXY_RESIDENTIAL_PASSWORD: ${SMARTPROXY_RESIDENTIAL_PASSWORD:-}
      SMARTPROXY_RESIDENTIAL_ENDPOINT: ${SMARTPROXY_RESIDENTIAL_ENDPOINT:-gate.decodo.com:7000}
      SMARTPROXY_RESIDENTIAL_PORT_START: ${SMARTPROXY_RESIDENTIAL_PORT_START:-0}
      SMARTPROXY_RESIDENTIAL_PORT_COUNT: ${SMARTPROXY_RESIDENTIAL_PORT_COUNT:-0}
    expose: ["8080"]
    networks:
      default:
        aliases: [autodom-vin-api]
    healthcheck:
      test: [CMD, node, apps/vin/dist/cli.js, health]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  default:
    name: ${AUTODOM_NETWORK:-autodom}
    external: true
